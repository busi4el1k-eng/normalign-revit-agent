<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normalign</title>
<style>
  /* ── Paletă preluată 1:1 din aplicația web (globals.css), comutată după tema Revit ── */
  :root{
    --background: oklch(0.99 0.008 80);
    --foreground: oklch(0.10 0.02 260);
    --card: oklch(1 0 0);
    --primary: oklch(0.18 0.05 260);
    --primary-foreground: oklch(0.98 0.01 260);
    --border: oklch(0.84 0.018 78);
    --muted: oklch(0.90 0.016 78);
    --muted-foreground: oklch(0.38 0.030 260);
    --user-bubble: oklch(0.94 0.014 78);
  }
  :root[data-theme="dark"]{
    --background: oklch(0.16 0.012 255);
    --foreground: oklch(0.85 0.01 260);
    --card: oklch(0.21 0.016 255);
    --primary: oklch(0.85 0.01 260);
    --primary-foreground: oklch(0.14 0.02 260);
    --border: oklch(0.24 0.025 250);
    --muted: oklch(0.22 0.016 255);
    --muted-foreground: oklch(0.56 0.022 260);
    --user-bubble: oklch(0.26 0.020 250);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--background);color:var(--foreground);
    font:13px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .hovermuted:hover{background:color-mix(in oklch,var(--foreground) 8%,transparent)}

  /* ── Header ─────────────────────────────────────────────────────────────── */
  header{
    display:flex;align-items:center;justify-content:space-between;
    height:40px;padding:0 10px;border-bottom:1px solid var(--border);
    flex-shrink:0;user-select:none;
  }
  #chat-title{font-size:12.5px;font-weight:600;color:var(--muted-foreground);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
  .hbtns{display:flex;gap:2px}
  .hbtn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;
    justify-content:center;color:var(--muted-foreground)}
  .hbtn:hover{background:color-mix(in oklch,var(--foreground) 8%,transparent);color:var(--foreground)}
  .hbtn svg{width:15px;height:15px}

  main{display:flex;flex-direction:column;height:100vh;position:relative}
  #scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
  #messages{max-width:760px;margin:0 auto;padding:16px 16px 8px}

  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--background)}

  /* ── Empty state ────────────────────────────────────────────────────────── */
  #empty{position:absolute;inset:40px 0 128px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;pointer-events:none;user-select:none}
  #empty .mark{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:600;color:var(--foreground);letter-spacing:.2px}
  #empty .hint{font-size:12.5px;color:var(--muted-foreground);max-width:300px;text-align:center}

  /* ── Mesaje ─────────────────────────────────────────────────────────────── */
  .msg{margin-bottom:18px;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .msg.user .body{background:var(--user-bubble);border-radius:12px;padding:8px 12px;white-space:pre-wrap}
  .msg.assistant .body{padding:0 2px}

  .body p{margin:0 0 10px}.body p:last-child{margin-bottom:0}
  .body h1,.body h2,.body h3,.body h4{margin:14px 0 8px;font-weight:600;line-height:1.3}
  .body h1{font-size:16px}.body h2{font-size:15px}.body h3{font-size:13.5px}.body h4{font-size:13px}
  .body ul,.body ol{margin:0 0 10px;padding-left:20px}.body li{margin-bottom:3px}
  .body code{background:var(--muted);border:1px solid var(--border);border-radius:4px;
    padding:1px 5px;font:12px/1.5 Consolas,"Cascadia Code",monospace}
  .body pre{background:var(--muted);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;overflow-x:auto;margin:0 0 10px}
  .body pre code{background:none;border:none;padding:0}
  .body blockquote{border-left:3px solid var(--border);padding:2px 0 2px 12px;color:var(--muted-foreground);margin:0 0 10px}
  .body hr{border:none;border-top:1px solid var(--border);margin:12px 0}
  .body a{color:var(--primary);text-decoration:none}.body a:hover{text-decoration:underline}
  .body .tbl{overflow-x:auto;margin:0 0 10px}
  .body table{border-collapse:collapse;font-size:12.5px;min-width:60%}
  .body th,.body td{border:1px solid var(--border);padding:5px 9px;text-align:left}
  .body th{background:var(--muted);font-weight:600}

  /* Citare — buton (deschide sursa: normativ = MD+PDF, fișă tehnică = MD) */
  .cite{display:inline-block;background:var(--muted);border:1px solid var(--border);
    border-radius:5px;padding:0 6px;margin:0 1px;font-size:11px;color:var(--primary);
    white-space:nowrap;vertical-align:baseline;cursor:pointer}
  .cite:hover{background:color-mix(in oklch,var(--primary) 16%,transparent)}
  /* Fișă tehnică — accent portocaliu (paritate cu web-ul) */
  .cite.ft,.srcbtn.ft{color:#d9822b;border-color:color-mix(in srgb,#d9822b 45%,var(--border))}
  .cite.ft:hover,.srcbtn.ft:hover{background:color-mix(in srgb,#d9822b 16%,transparent)}

  .sources{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .sources b{color:var(--muted-foreground);font-weight:600;font-size:11.5px}
  .srcbtn{font-size:11px;color:var(--primary);border:1px solid var(--border);
    background:var(--muted);border-radius:6px;padding:2px 8px}
  .srcbtn:hover{background:color-mix(in oklch,var(--primary) 16%,transparent)}

  .fups{display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .fup{text-align:left;font-size:12px;color:var(--muted-foreground);
    border:1px solid var(--border);border-radius:8px;padding:6px 10px}
  .fup:hover{color:var(--foreground);background:var(--muted)}

  /* Raționament (deep think) — colapsabil */
  .reason{margin-top:8px}
  .reason summary{cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted-foreground);
    list-style:none;display:flex;align-items:center;gap:5px}
  .reason summary::-webkit-details-marker{display:none}
  .reason summary svg{width:12px;height:12px}
  .reason .rbody{margin-top:6px;border:1px solid var(--border);background:var(--muted);
    border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.5;
    color:var(--muted-foreground);white-space:pre-wrap;max-height:280px;overflow-y:auto}

  .dots{display:inline-flex;gap:4px;padding:4px 0;align-items:center}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted-foreground);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .stage{font-size:12px;color:var(--muted-foreground);margin-left:8px}

  /* ── Zona de input ──────────────────────────────────────────────────────── */
  #inputwrap{flex-shrink:0;padding:8px 12px 12px;max-width:784px;margin:0 auto;width:100%}
  #inputbox{border:1px solid var(--border);border-radius:14px;background:var(--card);transition:border-color .15s}
  #inputbox:focus-within{border-color:color-mix(in oklch,var(--foreground) 22%,var(--border))}
  #ctxbar{display:flex;align-items:center;gap:6px;padding:7px 12px 0;font-size:11px;color:var(--muted-foreground);min-width:0}
  #ctxbar svg{width:12px;height:12px;flex-shrink:0;opacity:.7}
  #ctxbar .dot{width:6px;height:6px;border-radius:50%;background:#4cc38a;flex-shrink:0}
  #ctxbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #input{width:100%;background:none;border:none;outline:none;resize:none;color:var(--foreground);
    font:inherit;padding:8px 12px 4px;max-height:150px}
  #input::placeholder{color:var(--muted-foreground);opacity:.7}
  #inputrow{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px 8px}

  /* Segment mod: Standard / Aprofundat */
  #modes{display:inline-flex;background:var(--muted);border-radius:9px;padding:2px}
  .mode{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted-foreground);
    padding:4px 9px;border-radius:7px}
  .mode svg{width:13px;height:13px}
  .mode.active{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.15)}

  /* Modul Edit — accent chihlimbar: agentul poate modifica modelul */
  #inputbox.editing{border-color:color-mix(in srgb,#d9822b 55%,var(--border))}
  #amodes .mode.active.am-edit{color:#d9822b}
  #modes.hidden{display:none}

  /* Bara de confirmare a agentului (Da/Nu pentru modificări) */
  .confirmbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
    border:1px solid color-mix(in srgb,#d9822b 45%,var(--border));border-radius:10px;padding:8px 10px}
  .confirmbar .clabel{font-size:12px;color:var(--muted-foreground);flex:1;min-width:140px}
  .cbtn{font-size:12px;font-weight:600;border-radius:8px;padding:5px 14px;border:1px solid var(--border)}
  .cbtn.yes{background:#d9822b;color:#fff;border-color:#d9822b}
  .cbtn.yes:hover{filter:brightness(1.1)}
  .cbtn.no{color:var(--muted-foreground)}
  .cbtn.no:hover{background:var(--muted);color:var(--foreground)}

  /* Activitatea agentului (tool-uri) în bula de progres */
  .tact{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-foreground);
    margin-top:5px;padding:3px 8px;border:1px solid var(--border);border-radius:7px;width:fit-content}
  .tact.run::before{content:"⚙";animation:spin 1.4s linear infinite;display:inline-block}
  .tact.done::before{content:"✓";color:#4cc38a}
  .tact.error::before{content:"✕";color:#c0503b}
  @keyframes spin{to{transform:rotate(360deg)}}

  #send{width:30px;height:30px;border-radius:9px;background:var(--muted);color:var(--muted-foreground);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  #send.on{background:var(--primary);color:var(--primary-foreground)}
  #send.stop{background:#c0503b;color:#fff}
  #send svg{width:15px;height:15px}

  /* ── Drawer istoric ─────────────────────────────────────────────────────── */
  #histwrap{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;z-index:30}
  #hist{position:absolute;top:44px;right:10px;width:min(320px,85vw);max-height:64vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
  #hist .hd{font-size:11px;font-weight:600;color:var(--muted-foreground);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.4px}
  .hitem{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:12.5px}
  .hitem:hover{background:var(--muted)}
  .hitem .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hitem .d{font-size:10.5px;color:var(--muted-foreground);margin-top:1px}
  .hempty{padding:12px 10px;font-size:12px;color:var(--muted-foreground)}

  #err{display:none;margin:0 16px 8px;max-width:744px;border:1px solid #a8503f;
    background:color-mix(in oklch,#a8503f 18%,var(--background));color:#e6907b;border-radius:10px;padding:8px 12px;font-size:12px}

  /* ── Reader surse (peste chat): normativ = taburi Conținut/PDF, fișă = MD ── */
  #srcview{position:absolute;inset:0;background:var(--background);display:none;flex-direction:column;z-index:20}
  #srcview.show{display:flex}
  #srcbar{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px;border-bottom:1px solid var(--border);flex-shrink:0}
  #srcbar .name{flex:1;font-size:12.5px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #srctabs{display:inline-flex;background:var(--muted);border-radius:9px;padding:2px;flex-shrink:0}
  .stab{font-size:11.5px;color:var(--muted-foreground);padding:3px 9px;border-radius:7px;white-space:nowrap}
  .stab.active{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.15)}
  #srcnav{display:flex;align-items:center;gap:2px;flex-shrink:0}
  #srcnav .pg{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;padding:0 4px}
  #srcnav .hbtn[disabled]{opacity:.35;cursor:default}
  #pdfframe{flex:1;border:none;background:#525659;display:none}
  #mdpane{flex:1;overflow-y:auto;display:none}
  #mdinner{max-width:760px;margin:0 auto;padding:16px}
  #mdinner img{max-width:100%;height:auto;border-radius:8px;margin:4px 0}
  .body img{max-width:100%;height:auto}
  .mdstate{padding:24px 16px;font-size:12.5px;color:var(--muted-foreground);text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <div id="chat-title">Conversație nouă</div>
    <div class="hbtns">
      <button class="hbtn" id="btn-hist" title="Istoric conversații">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="hbtn" id="btn-new" title="Conversație nouă">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="hbtn" id="btn-logout" title="Deconectare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div id="scroll"><div id="messages"></div></div>

  <div id="empty">
    <div class="mark">Normalign</div>
    <div class="hint">Întreabă despre normative românești sau despre modelul Revit deschis.</div>
  </div>

  <div id="err"></div>

  <div id="inputwrap">
    <div id="inputbox">
      <div id="ctxbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
        <span id="ctx-text">Se conectează la Revit…</span>
      </div>
      <textarea id="input" rows="1" placeholder="Întreabă Normalign…"></textarea>
      <div id="inputrow">
        <div style="display:flex;gap:6px;align-items:center;min-width:0">
          <div id="amodes">
            <div style="background:var(--muted);border-radius:9px;padding:2px;display:inline-flex">
              <button class="mode active am-plan" id="amode-plan" title="Plan: întrebări și analiză — nu modifică modelul">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Plan
              </button>
              <button class="mode am-edit" id="amode-edit" title="Edit: agentul poate lucra direct pe model (interogare + modificare)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>Edit
              </button>
            </div>
          </div>
          <div id="modes">
            <button class="mode active" id="mode-std" title="Răspuns rapid">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-2 8 9-12h-7z"/></svg>Standard
            </button>
            <button class="mode" id="mode-deep" title="Raționament aprofundat (mai lent)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3a5 5 0 0 0-3 9c.6.5 1 1.2 1 2v1h4v-1c0-.8.4-1.5 1-2a5 5 0 0 0-3-9zM8 20h4M9 22h2"/></svg>Aprofundat
            </button>
          </div>
        </div>
        <button id="send" title="Trimite">
          <svg id="send-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Reader surse peste chat (normativ: Conținut/PDF; fișă tehnică: Conținut) -->
  <div id="srcview">
    <div id="srcbar">
      <button class="hbtn" id="src-back" title="Înapoi la chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="name" id="src-name"></div>
      <div id="srctabs">
        <button class="stab active" id="tab-md">Conținut</button>
        <button class="stab" id="tab-pdf">PDF</button>
      </div>
      <div id="srcnav">
        <button class="hbtn" id="src-prev" title="Pagina anterioară">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="pg" id="src-pg"></div>
        <button class="hbtn" id="src-next" title="Pagina următoare">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <button class="hbtn" id="src-ext" title="Deschide în browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
      </button>
    </div>
    <div id="mdpane"><div id="mdinner"></div></div>
    <iframe id="pdfframe" title="PDF"></iframe>
  </div>
</main>

<div id="histwrap"><div id="hist"><div class="hd">Conversații</div><div id="histlist"><div class="hempty">Se încarcă…</div></div></div></div>

<script>
"use strict";
const host = window.chrome && window.chrome.webview;
const $ = id => document.getElementById(id);
const CDN = "https://digital-standart-lib.fra1.cdn.digitaloceanspaces.com";

let chatId = null, busy = false, deepMode = false, agentMode = "planning";

// doc_code -> "normative" | "fise_tehnice" (vine din metadata.sourceTypes;
// se acumulează per sesiune — doc_code-urile sunt unice global).
const srcTypes = {};
function mergeSrcTypes(st){ if(st) Object.keys(st).forEach(k=>{ srcTypes[k]=st[k]; }); }
// Fallback (aceeași convenție ca web-ul): fișele au doc_code "companie/produs".
function srcTypeOf(doc){ return srcTypes[doc] || (doc.indexOf("/")>=0 ? "fise_tehnice" : "normative"); }
// Normativele sunt 0-indexate în Qdrant -> pagina afișată/navigată = +1.
// Fișele tehnice sunt deja corect indexate.
function displayPage(doc,rawPage){
  if(rawPage==null) return null;
  return srcTypeOf(doc)==="fise_tehnice" ? rawPage : rawPage+1;
}

// ── Markdown compact (titluri, liste, cod, tabele, citări SURSĂ clicabile) ──
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function citeChip(doc,rawPage){
  const ft = srcTypeOf(doc)==="fise_tehnice";
  const dp = displayPage(doc,rawPage);
  return '<button class="cite'+(ft?' ft':'')+'" data-doc="'+esc(doc)+'" data-page="'+(dp||1)+'">'+
    esc(doc)+(dp?' · p.'+dp:'')+'</button>';
}
function inline(s){
  // indexul e opțional: chatul RAG emite [SURSĂ 3 | doc | pag. N], agentul [SURSĂ | doc | pag. N]
  s = s.replace(/\[SURSĂ(?:\s+\d+)?\s*\|\s*([^|\]]+?)\s*\|\s*pag\.\s*(\d+)\]/g,(m,d,p)=>citeChip(d.trim(),parseInt(p,10)));
  s = s.replace(/\[SURSĂ(?:\s+\d+)?\s*\|\s*([^|\]]+?)\s*\]/g,(m,d)=>citeChip(d.trim(),null));
  s = s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function md(src){
  const lines = esc(src.replace(/\r\n/g,"\n")).split("\n"); const out=[]; let i=0;
  while(i<lines.length){ const l=lines[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push("<pre><code>"+buf.join("\n")+"</code></pre>");continue;}
    if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;out.push(`<h${n}>`+inline(l.replace(/^#+ /,""))+`</h${n}>`);i++;continue;}
    if(/^\s*[-*] /.test(l)){const b=[];while(i<lines.length&&/^\s*[-*] /.test(lines[i]))b.push("<li>"+inline(lines[i++].replace(/^\s*[-*] /,""))+"</li>");out.push("<ul>"+b.join("")+"</ul>");continue;}
    if(/^\s*\d+[.)] /.test(l)){const b=[];while(i<lines.length&&/^\s*\d+[.)] /.test(lines[i]))b.push("<li>"+inline(lines[i++].replace(/^\s*\d+[.)] /,""))+"</li>");out.push("<ol>"+b.join("")+"</ol>");continue;}
    if(/^>/.test(l)){const b=[];while(i<lines.length&&/^>/.test(lines[i]))b.push(inline(lines[i++].replace(/^>\s?/,"")));out.push("<blockquote>"+b.join("<br>")+"</blockquote>");continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(/^\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|");
      const head=cells(l).map(c=>"<th>"+inline(c.trim())+"</th>").join("");i+=2;const rows=[];
      while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i]))rows.push("<tr>"+cells(lines[i++]).map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>");
      out.push('<div class="tbl"><table><thead><tr>'+head+"</tr></thead><tbody>"+rows.join("")+"</tbody></table></div>");continue;}
    if(l.trim()===""){i++;continue;}
    const b=[l];i++;
    while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,4} |```|\s*[-*] |\s*\d+[.)] |>|\|.*\|\s*$|\s*---+\s*$)/.test(lines[i]))b.push(lines[i++]);
    out.push("<p>"+inline(b.join(" "))+"</p>");
  }
  return out.join("");
}

function addMsg(role,html){
  $("empty").style.display="none";
  const d=document.createElement("div");d.className="msg "+role;
  d.innerHTML='<div class="body">'+html+"</div>";
  $("messages").appendChild(d);scrollDown();return d;
}
function scrollDown(){const s=$("scroll");s.scrollTop=s.scrollHeight}
function showError(t){const e=$("err");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",9000)}

function reasonBlock(text){
  if(!text) return "";
  return '<details class="reason"><summary>'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3a5 5 0 0 0-3 9c.6.5 1 1.2 1 2v1h4v-1c0-.8.4-1.5 1-2a5 5 0 0 0-3-9z"/></svg>'+
    'Raționament</summary><div class="rbody">'+esc(text)+"</div></details>";
}
// ── Confirmarea agentului: linia "[CONFIRMĂ] ..." devine butoane Da/Nu ─────
function stripConfirm(content){
  const m=content.match(/\n?\[CONFIRMĂ\]\s*([^\n]+)\s*$/);
  if(!m) return {text:content, ask:null};
  return {text:content.slice(0,m.index).trim(), ask:m[1].trim()};
}
function confirmBar(ask){
  const bar=document.createElement("div");bar.className="confirmbar";
  const label=document.createElement("span");label.className="clabel";label.textContent=ask;
  const yes=document.createElement("button");yes.className="cbtn yes";yes.textContent="✓ Da, execută";
  const no=document.createElement("button");no.className="cbtn no";no.textContent="Nu";
  yes.onclick=()=>{bar.remove();send("Da — execută exact ce ai propus.");};
  no.onclick=()=>{bar.remove();send("Nu executa. Anulează acțiunea propusă.");};
  bar.appendChild(yes);bar.appendChild(no);bar.appendChild(label);
  return bar;
}

function sourcesHtml(citations){
  if(!citations) return "";
  const entries=Object.entries(citations);if(!entries.length) return "";
  let h='<div class="sources"><b>Surse:</b>';
  entries.forEach(([doc,pages])=>{
    const ft=srcTypeOf(doc)==="fise_tehnice";
    const cls='srcbtn'+(ft?' ft':'');
    const list=(pages&&pages.length)?pages:[null];
    // un buton per pagină citată, ca fiecare să navigheze exact acolo
    list.forEach(p=>{
      const dp=displayPage(doc,p);
      h+='<button class="'+cls+'" data-doc="'+esc(doc)+'" data-page="'+(dp||1)+'">'+
        esc(doc)+(dp?' · pag. '+dp:'')+'</button>';
    });
  });
  return h+"</div>";
}

// ── Progres (bulă temporară în timpul generării) ────────────────────────────
let progressEl=null, reasonBuf="";
function startProgress(){
  reasonBuf="";
  progressEl=addMsg("assistant",'<span class="dots"><i></i><i></i><i></i></span><span class="stage" id="stage-txt"></span><div id="tool-log"></div><div class="rbody" id="live-reason" style="display:none;margin-top:8px"></div>');
}
// Chip-uri de activitate ale agentului (Edit): rulează / gata / eroare per tool.
function toolActivity(name,status){
  const log=$("tool-log"); if(!log) return;
  if(status==="run"){
    const d=document.createElement("div");d.className="tact run";d.dataset.name=name;d.textContent=name;
    log.appendChild(d);scrollDown();return;
  }
  const items=log.querySelectorAll('.tact.run[data-name="'+CSS.escape(name)+'"]');
  const el=items.length?items[items.length-1]:null;
  if(el){el.className="tact "+(status==="error"?"error":"done");}
  else{const d=document.createElement("div");d.className="tact "+(status==="error"?"error":"done");d.textContent=name;log.appendChild(d);}
  scrollDown();
}
function setStage(label){const s=$("stage-txt");if(s)s.textContent=label||""}
function addThinking(delta){
  reasonBuf+=delta;
  const r=$("live-reason");
  if(r){r.style.display="block";r.textContent=reasonBuf;r.scrollTop=r.scrollHeight;scrollDown();}
}
function clearProgress(){if(progressEl){progressEl.remove();progressEl=null;}}

// ── Trimitere ───────────────────────────────────────────────────────────────
function send(text){
  const msg=(text!==undefined?text:$("input").value).trim();
  if(!msg||busy||!host) return;
  $("input").value="";autoGrow();
  addMsg("user",esc(msg));
  setBusy(true);
  startProgress();
  if(agentMode==="edit") setStage("Pornesc agentul…");
  else if(deepMode) setStage("Se pregătește analiza…");
  host.postMessage(JSON.stringify({type:"send",message:msg,chatId:chatId,deepThink:agentMode==="edit"?false:deepMode,mode:agentMode}));
}
function stop(){ if(!busy) return; if(host) host.postMessage(JSON.stringify({type:"stop"}));
  clearProgress(); addMsg("assistant",'<span style="color:var(--muted-foreground);font-size:12px">Oprit.</span>'); setBusy(false); }

function setBusy(b){
  busy=b;
  const s=$("send");
  if(b){s.classList.add("stop");s.classList.remove("on");
    $("send-ic").innerHTML='<rect x="6" y="6" width="12" height="12" rx="2"/>';s.title="Oprește";}
  else{s.classList.remove("stop");
    $("send-ic").innerHTML='<path d="M12 19V5M5 12l7-7 7 7"/>';s.title="Trimite";updateSend();}
}
function updateSend(){ if(busy) return; const has=$("input").value.trim().length>0; $("send").classList.toggle("on",has); }

// ── Mesaje de la gazdă (C#) ─────────────────────────────────────────────────
if(host) host.addEventListener("message",ev=>{
  let d=ev.data; if(typeof d==="string"){try{d=JSON.parse(d)}catch{return}}
  if(!d||!d.type) return;

  if(d.type==="theme"){ document.documentElement.dataset.theme = (d.theme==="light"?"light":"dark"); }
  else if(d.type==="context"){
    if(d.theme) document.documentElement.dataset.theme=(d.theme==="light"?"light":"dark");
    const parts=[d.file||"Fără model"]; if(d.view) parts.push(d.view);
    let t=parts.join(" · "); if(d.selection>0) t+=" · "+d.selection+" selectate";
    $("ctx-text").textContent=t;
    if(!document.querySelector("#ctxbar .dot")){const dot=document.createElement("span");dot.className="dot";$("ctxbar").insertBefore(dot,$("ctxbar").firstChild);}
  }
  else if(d.type==="stage"){ setStage(d.label||""); }
  else if(d.type==="tool_activity"){ toolActivity(d.name||"tool", d.status||"run"); }
  else if(d.type==="thinking"){ if(typeof d.delta==="string") addThinking(d.delta); }
  else if(d.type==="reply"){
    clearProgress(); setBusy(false);
    if(d.chatId) chatId=d.chatId;
    mergeSrcTypes(d.sourceTypes); // înainte de md(): chip-urile au nevoie de tip
    const cf=stripConfirm(d.content||"");
    let html=md(cf.text);
    if(reasonBuf || d.thinking) html+=reasonBlock(d.thinking||reasonBuf);
    html+=sourcesHtml(d.citations);
    const el=addMsg("assistant",html);
    if(cf.ask) el.appendChild(confirmBar(cf.ask));
    if(Array.isArray(d.followUps)&&d.followUps.length){
      const w=document.createElement("div");w.className="fups";
      d.followUps.forEach(q=>{const b=document.createElement("button");b.className="fup";b.textContent=q;b.onclick=()=>send(q);w.appendChild(b);});
      el.appendChild(w);
    }
    scrollDown();
  }
  else if(d.type==="stopped"){ clearProgress(); setBusy(false); }
  else if(d.type==="history"){
    const list=$("histlist");list.innerHTML="";const chats=d.chats||[];
    if(!chats.length){list.innerHTML='<div class="hempty">Nicio conversație încă.</div>';return;}
    chats.forEach(c=>{const b=document.createElement("button");b.className="hitem";
      const when=c.createdAt?new Date(c.createdAt).toLocaleDateString("ro-RO",{day:"numeric",month:"short",year:"numeric"}):"";
      b.innerHTML='<div class="t">'+esc(c.title||"Conversație")+'</div><div class="d">'+when+"</div>";
      b.onclick=()=>{closeHist();openChat(c.id,c.title);};list.appendChild(b);});
  }
  else if(d.type==="messages"){
    $("messages").innerHTML="";chatId=d.chatId;
    (d.messages||[]).forEach(m=>{
      if(m.role==="user") addMsg("user",esc(m.content||""));
      else{mergeSrcTypes(m.metadata&&m.metadata.sourceTypes);
        // în istoric marcajul [CONFIRMĂ] se afișează ca text simplu, fără butoane
        let html=md(stripConfirm(m.content||"").text);
        html+=reasonBlock(m.metadata&&m.metadata.thinking);
        html+=sourcesHtml(m.metadata&&m.metadata.citations);addMsg("assistant",html);}
    });scrollDown();
  }
  else if(d.type==="error"){ clearProgress(); setBusy(false); showError(d.message||"Eroare necunoscută."); }
});

function openChat(id,title){$("chat-title").textContent=title||"Conversație";if(host)host.postMessage(JSON.stringify({type:"messages",chatId:id}));}
function newChat(){chatId=null;$("chat-title").textContent="Conversație nouă";$("messages").innerHTML="";$("empty").style.display="flex";$("input").focus();}

// ── Reader surse ────────────────────────────────────────────────────────────
// Normativ:      {CDN}/normative_library/{code}/{code}.md + {code}.pdf
// Fișă tehnică:  {CDN}/products_library/{companie}/{produs}.md   (fără PDF)
// MD-ul e paginat cu markere "{N}" pe linie proprie (aceeași logică ca în web).
let srcCurrent=null;          // {doc,type,page,tab,shown}
const mdCache={};             // "type:doc" -> {pages:Map, ordered:[...], maxPage}

function normCode(doc){return doc.replace(/\.pdf$/i,"");}
function pdfUrl(doc,page){
  const name=normCode(doc);
  return CDN+"/normative_library/"+encodeURIComponent(name)+"/"+encodeURIComponent(name)+".pdf#page="+(page||1);
}
function mdUrl(doc,type){
  if(type==="fise_tehnice"){
    const i=doc.indexOf("/"), company=doc.slice(0,i), product=doc.slice(i+1);
    return CDN+"/products_library/"+encodeURIComponent(company)+"/"+
      product.split("/").map(encodeURIComponent).join("/")+".md";
  }
  const name=normCode(doc);
  return CDN+"/normative_library/"+encodeURIComponent(name)+"/"+encodeURIComponent(name)+".md";
}
function imgBase(doc,type){
  if(type==="fise_tehnice") return CDN+"/products_library/"+encodeURIComponent(doc.slice(0,doc.indexOf("/")));
  return CDN+"/normative_library/"+encodeURIComponent(normCode(doc));
}

// Portat din web (library-panel.tsx extractPages): pagini delimitate de "{N}".
const PAGE_MARKER_RE=/^\{(\d+)\}[-─=—\s]*$/;
function extractPages(markdown){
  const lines=markdown.split("\n"), pages=new Map();
  let cur=null, buf=[];
  const flush=()=>{ if(cur!==null){const t=buf.join("\n").trim(); if(t) pages.set(cur,t);} buf=[]; };
  for(const line of lines){
    const m=line.trim().match(PAGE_MARKER_RE);
    if(m){flush();cur=parseInt(m[1],10);} else buf.push(line);
  }
  flush();
  if(pages.size===0 && markdown.trim()) pages.set(1,markdown.trim());
  const ordered=Array.from(pages.keys()).sort((a,b)=>a-b);
  return {pages,ordered,maxPage:ordered.length?ordered[ordered.length-1]:1};
}

function openSource(doc,page){
  const type=srcTypeOf(doc);
  srcCurrent={doc,type,page:page||1,tab:"md",shown:null};
  $("src-name").textContent=normCode(doc).replace(/_/g," ");
  $("tab-pdf").style.display = type==="normative" ? "" : "none"; // fișele n-au PDF
  $("srcview").classList.add("show");
  setSrcTab("md");
}
function closeSource(){
  $("srcview").classList.remove("show");
  $("pdfframe").src="about:blank";
  srcCurrent=null;
}
function setSrcTab(tab){
  if(!srcCurrent) return;
  srcCurrent.tab=tab;
  $("tab-md").classList.toggle("active",tab==="md");
  $("tab-pdf").classList.toggle("active",tab==="pdf");
  const isPdf=tab==="pdf";
  $("pdfframe").style.display=isPdf?"block":"none";
  $("mdpane").style.display=isPdf?"none":"block";
  $("srcnav").style.display=isPdf?"none":"flex";
  if(isPdf){
    $("src-pg").textContent="";
    $("pdfframe").src=pdfUrl(srcCurrent.doc,srcCurrent.shown||srcCurrent.page);
  } else loadMd();
}
async function loadMd(){
  const cur=srcCurrent; if(!cur) return;
  const key=cur.type+":"+cur.doc;
  if(mdCache[key]){renderMdPage();return;}
  $("mdinner").innerHTML='<div class="mdstate">Se încarcă…</div>';
  try{
    const r=await fetch(mdUrl(cur.doc,cur.type));
    if(!r.ok) throw new Error("HTTP "+r.status);
    mdCache[key]=extractPages(await r.text());
  }catch(err){
    if(srcCurrent!==cur) return;
    let msg='Conținutul nu a putut fi încărcat.';
    if(cur.type==="normative") msg+=' Încearcă tab-ul „PDF".';
    $("mdinner").innerHTML='<div class="mdstate">'+msg+'</div>';
    return;
  }
  if(srcCurrent!==cur) return; // s-a închis / s-a deschis altă sursă între timp
  renderMdPage();
}
function renderMdPage(){
  const c=srcCurrent; if(!c) return;
  const d=mdCache[c.type+":"+c.doc]; if(!d) return;
  const nums=d.ordered;
  // pagina cerută dacă există, altfel cea mai apropiată anterioară, altfel prima
  let pg = d.pages.has(c.page) ? c.page : (nums.filter(n=>n<=c.page).pop() ?? nums[0]);
  c.shown=pg;
  const idx=nums.indexOf(pg);
  $("src-pg").textContent="pag. "+pg+" / "+d.maxPage;
  $("src-prev").disabled = idx<=0;
  $("src-next").disabled = idx>=nums.length-1;
  $("mdinner").innerHTML=md(d.pages.get(pg)||"");
  // imaginile relative din MD -> folderul documentului pe CDN
  const base=imgBase(c.doc,c.type);
  $("mdinner").querySelectorAll("img").forEach(img=>{
    const s=img.getAttribute("src")||"";
    if(s && !/^(https?:|data:)/i.test(s)) img.src=base+"/"+s.split("/").pop();
  });
  $("mdpane").scrollTop=0;
}
function mdStep(dir){
  const c=srcCurrent; if(!c) return;
  const d=mdCache[c.type+":"+c.doc]; if(!d) return;
  const idx=d.ordered.indexOf(c.shown);
  const next=d.ordered[idx+dir];
  if(next!==undefined){c.page=next;renderMdPage();}
}
$("src-back").onclick=closeSource;
$("tab-md").onclick=()=>setSrcTab("md");
$("tab-pdf").onclick=()=>setSrcTab("pdf");
$("src-prev").onclick=()=>mdStep(-1);
$("src-next").onclick=()=>mdStep(1);
$("src-ext").onclick=()=>{
  if(!srcCurrent||!host) return;
  const c=srcCurrent;
  const url = (c.tab==="pdf") ? pdfUrl(c.doc,c.shown||c.page) : mdUrl(c.doc,c.type);
  host.postMessage(JSON.stringify({type:"open",url:url}));
};

// click pe citări / surse -> reader; click pe linkuri http -> browser sistem
document.addEventListener("click",e=>{
  const cite=e.target.closest(".cite,.srcbtn");
  if(cite){openSource(cite.dataset.doc,parseInt(cite.dataset.page)||1);return;}
  const a=e.target.closest("a");
  if(a&&/^https?:/.test(a.href)){e.preventDefault();if(host)host.postMessage(JSON.stringify({type:"open",url:a.href}));}
});

// ── Istoric ─────────────────────────────────────────────────────────────────
function openHist(){$("histwrap").style.display="block";$("histlist").innerHTML='<div class="hempty">Se încarcă…</div>';if(host)host.postMessage(JSON.stringify({type:"history"}));}
function closeHist(){$("histwrap").style.display="none";}
$("btn-hist").onclick=openHist;$("btn-new").onclick=newChat;
$("btn-logout").onclick=()=>{ if(host&&confirm("Te deconectezi din Normalign?")) host.postMessage(JSON.stringify({type:"logout"})); };
$("histwrap").onclick=e=>{if(e.target===$("histwrap"))closeHist();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("srcview").classList.contains("show"))closeSource();else closeHist();}});

// ── Mod standard / aprofundat ───────────────────────────────────────────────
$("mode-std").onclick=()=>setMode(false);
$("mode-deep").onclick=()=>setMode(true);
function setMode(deep){deepMode=deep;$("mode-std").classList.toggle("active",!deep);$("mode-deep").classList.toggle("active",deep);}

// ── Mod Plan / Edit (agentul poate modifica modelul doar în Edit) ──────────
$("amode-plan").onclick=()=>setAgentMode("planning");
$("amode-edit").onclick=()=>setAgentMode("edit");
function setAgentMode(m){
  agentMode=m;
  const edit=m==="edit";
  $("amode-plan").classList.toggle("active",!edit);
  $("amode-edit").classList.toggle("active",edit);
  $("modes").classList.toggle("hidden",edit);     // Standard/Aprofundat doar în Plan
  $("inputbox").classList.toggle("editing",edit);
  $("input").placeholder = edit
    ? "Cere agentului să analizeze sau să modifice modelul…"
    : "Întreabă Normalign…";
}

// ── Input ───────────────────────────────────────────────────────────────────
const input=$("input");
function autoGrow(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"}
input.addEventListener("input",()=>{autoGrow();updateSend();});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();busy?stop():send();}});
$("send").onclick=()=>{busy?stop():send();};

if(host) host.postMessage(JSON.stringify({type:"ready"}));
input.focus();
</script>
